<section class="listado-clientes-telegram">
  <div class="listado-clientes-telegram__header">
    <h3 class="listado-clientes-telegram__title">Clientes Autorizados de Telegram</h3>
    <app-button
      label="Nuevo cliente"
      intent="primary"
      icon="pi-plus"
      (clicked)="onNuevoCliente()"
    />
  </div>
  <div class="listado-clientes-telegram__separator" aria-hidden="true"></div>
  <p class="listado-clientes-telegram__note">
    Son los clientes habilitados para realizar consultas al bot de Telegram.
  </p>

  <app-filter-panel (filterChange)="onFilterChange($event)" />

  <app-table [columns]="columns" [loadDataFn]="loadDataFn" [getInlineActions]="inlineActions" />
</section>

<app-cliente-telegram-form-dialog
  [visible]="dialogVisible()"
  [cliente]="clienteSeleccionado()"
  (cancelado)="onCancelarDialog()"
  (guardado)="onGuardarDialog($event)"
/>
