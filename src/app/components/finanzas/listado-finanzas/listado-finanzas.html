<app-page-layout
  pageTitle="Finanzas"
  pageDescription="Gestiona y consulta los movimientos financieros del sistema"
>
  <app-button
    actions
    label="Nuevo Movimiento"
    intent="primary"
    icon="pi-plus"
    (clicked)="onNuevoMovimiento()"
  />

  <app-button
    actions
    label="Descargar listado"
    intent="secondary"
    icon="pi-download"
    [disabled]="!puedeExportar()"
    [loading]="exportando()"
    (clicked)="onDescargarListado()"
  />

  <app-filter-panel (filterChange)="onFilterChange($event)" />
  <app-table [columns]="columns" [loadDataFn]="loadDataFn" [getRowActions]="rowActions" />
</app-page-layout>
