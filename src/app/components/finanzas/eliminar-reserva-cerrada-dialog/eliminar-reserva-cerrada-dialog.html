<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [resizable]="false"
  [draggable]="false"
  header="Eliminar movimiento de reserva cerrada"
  [style]="{ width: '580px' }"
>
  <div class="alert-warning">
    <div class="alert-warning__header">
      <i class="pi pi-exclamation-circle"></i>
      <span>Reserva finalizada o cancelada</span>
    </div>
    <p class="alert-warning__text">{{ message() }}</p>
  </div>

  <p class="dialog-hint">
    Como la reserva ya está cerrada, ninguna de las dos opciones modifica su información. Se sugiere
    registrar un egreso para compensar el importe: solo impacta en el balance general. Eliminar el
    movimiento tampoco afecta la reserva.
  </p>

  <ng-template #footer>
    <div class="dialog-footer">
      <app-button
        intent="secondary"
        label="Cancelar"
        [disabled]="procesando()"
        (clicked)="cancelar.emit()"
      />
      <div class="dialog-footer__actions">
        <app-button
          intent="primary"
          label="Registrar egreso"
          [disabled]="procesando()"
          (clicked)="registrarEgreso.emit()"
        />
        <app-button
          intent="danger"
          label="Eliminar de todas formas"
          [loading]="procesando()"
          [disabled]="procesando()"
          (clicked)="eliminar.emit()"
        />
      </div>
    </div>
  </ng-template>
</p-dialog>
