<app-page-layout
  pageTitle="Detalle de Movimiento Financiero"
  pageDescription="Información completa del movimiento"
  [showBackButton]="true"
  backButtonLink="/finanzas"
>
  <app-form-layout>
    <app-detail-section title="Resumen del Movimiento" [fields]="infoFields()" />

    @if (registroData()) {
      <app-detail-registro-section [data]="registroData()!" [extraFields]="registroExtraFields()" />
    }

    <app-form-actions actions>
      <app-button label="Editar" intent="primary" icon="pi-pencil" (clicked)="onEditar()" />
    </app-form-actions>
  </app-form-layout>
</app-page-layout>
