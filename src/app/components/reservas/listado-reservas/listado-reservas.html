@if (breakpoint.isMobile()) {
  <app-mob-list-layout>
    <app-mob-page-header header title="Reservas" (menuToggled)="sidebar.open()" />

    <app-mob-filter-panel
      filters
      (filtersApply)="onApplyFilters($event)"
      (filtersClear)="onClearFilters()"
    />

    @for (reserva of mobileList.rows(); track reserva.id) {
      <!--
        Las acciones están deshabilitadas en esta primera entrega mobile.
        Para habilitarlas en el futuro, pasar [actions]="rowActions(reserva)".
      -->
      <app-mob-reserva-card [reserva]="reserva" />
    } @empty {
      <div class="reservas-mobile__empty">No se encontraron reservas.</div>
    }

    @if (mobileList.hasMore()) {
      <div appMobInfiniteScroll (scrolled)="mobileList.loadMore()" aria-hidden="true"></div>
    }
  </app-mob-list-layout>
  <app-mob-fab (clicked)="onNuevaReserva()" />
} @else {
  <app-page-layout
    pageTitle="Listado de Reservas"
    pageDescription="Listado y gestión del módulo de reservas"
  >
    <app-button
      actions
      label="Nueva Reserva"
      intent="primary"
      icon="pi-plus"
      (clicked)="onNuevaReserva()"
    />

    <app-button
      actions
      label="Descargar listado"
      intent="secondary"
      icon="pi-download"
      [disabled]="!tableExport.puedeExportar()"
      [loading]="tableExport.exportando()"
      (clicked)="onExportar()"
    />

    <app-pago-reserva
      [reserva]="reservaPagoSeleccionada()"
      (closed)="onCerrarPagoReserva()"
      (pagoRegistrado)="onPagoReservaRegistrado()"
    />

    <app-verification-dialog
      [visible]="verificandoCancelacionVisible()"
      title="Verificando cancelación"
      [message]="
        'Revisando si la reserva #' +
        (reservaCancelacionSeleccionada()?.id ?? '') +
        ' tiene pagos asociados...'
      "
    />

    <app-pagos-asociados-dialog
      [visible]="cancelacionCheck() !== null"
      [numeroReserva]="reservaCancelacionSeleccionada()?.id ?? null"
      [pagos]="cancelacionCheck()?.pagosAsociados ?? []"
      [importeTotalPagos]="cancelacionCheck()?.importeTotalPagos ?? 0"
      [procesando]="procesando()"
      (cancelar)="onCerrarCancelacionConPagos()"
      (confirmar)="onConfirmarCancelacionConPagos($event)"
    />

    <app-verification-dialog
      [visible]="verificandoFinalizacionVisible()"
      title="Verificando finalización"
      [message]="
        'Revisando si la reserva #' +
        (reservaFinalizacionSeleccionada()?.id ?? '') +
        ' tiene saldo pendiente...'
      "
    />

    <app-completar-pago-dialog
      [visible]="finalizacionCheck() !== null"
      [numeroReserva]="reservaFinalizacionSeleccionada()?.id ?? null"
      [montoImpago]="finalizacionCheck()?.montoImpago ?? 0"
      [procesando]="procesando()"
      (cancelar)="onCerrarFinalizacionConSaldo()"
      (confirmar)="onConfirmarFinalizacionConSaldo($event)"
    />

    <app-filter-panel (filterChange)="onFilterChange($event)" />

    <app-table [columns]="columns" [loadDataFn]="loadDataFn" [getRowActions]="rowActions" />
  </app-page-layout>
}
