<app-page-layout pageTitle="Listado de Reservas" pageDescription="Listado y gestión del módulo de reservas">
  <app-button actions label="Exportar" intent="secondary" icon="pi-download" />
  <app-button actions label="Nueva Reserva" intent="primary" icon="pi-plus" (clicked)="onNuevaReserva()" />
  <app-pago-reserva [reserva]="reservaPagoSeleccionada()" (closed)="onCerrarPagoReserva()"
    (pagoRegistrado)="onPagoReservaRegistrado()" />

  <app-filter-panel (filterChange)="onFilterChange($event)" />

  <app-table [columns]="columns" [loadDataFn]="loadDataFn" [getRowActions]="rowActions" />
</app-page-layout>
