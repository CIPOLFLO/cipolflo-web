<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [resizable]="false"
  [draggable]="false"
  header="Verificando cancelación"
  [style]="{ width: '420px' }"
>
  <div class="verificando__content">
    <p-progress-spinner strokeWidth="4" />
    <p class="verificando__text">
      Revisando si la reserva <strong>#{{ numeroReserva() }}</strong> tiene pagos asociados...
    </p>
  </div>
</p-dialog>
