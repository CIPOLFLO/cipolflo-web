<app-page-layout
  pageTitle="Detalle de Reserva"
  pageDescription="Información completa de la reserva"
  [showBackButton]="true"
  backButtonLink="/reservas"
>
  <app-form-layout>
    <app-detail-section title="Información de la Reserva" [fields]="reservaFields()" />

    <app-detail-section title="Información del Cliente" [fields]="clienteFields()" />

    <app-historial-pagos-section [pagos]="historialPagos()" />

    <app-detail-section title="Información Adicional" [fields]="adicionalFields()" />

    @if (registroData()) {
      <app-detail-registro-section [data]="registroData()!" />
    }

    <app-form-actions actions>
      <app-button label="Modificar" icon="pi-pencil" (clicked)="onModificar()" />
      <app-button
        label="Descargar comprobante"
        icon="pi-download"
        intent="secondary"
        [loading]="descargando()"
        [disabled]="descargando()"
        (clicked)="onDescargarComprobante()"
      />
    </app-form-actions>
  </app-form-layout>
</app-page-layout>
