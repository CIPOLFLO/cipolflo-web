<app-page-layout
  pageTitle="Nuevo Servicio"
  pageDescription="Complete los datos para crear un nuevo servicio"
  [showBackButton]="true"
  backButtonLink="/servicios"
>
  <app-form-layout>
    <app-form-section
      title="Información General"
      [fields]="infoFields()"
      [errors]="infoErrors()"
      (valuesChange)="onInfoChange($event)"
      (fieldBlur)="onFieldBlur($event)"
    />

    <app-form-section
      title="Precios"
      [fields]="preciosFields()"
      [errors]="preciosErrors()"
      (valuesChange)="onPreciosChange($event)"
      (fieldBlur)="onFieldBlur($event)"
    />

    <div class="nuevo-servicio__checkbox-row">
      <input
        type="checkbox"
        id="requiereDocumentacion"
        [checked]="form.controls.requiereDocumentacion.value"
        (change)="onRequiereDocumentacionChange($event)"
      />
      <label for="requiereDocumentacion">Este servicio requiere documentación</label>
    </div>

    <app-form-actions actions>
      <p class="nuevo-servicio__info">
        El servicio se creará en estado
        <strong class="nuevo-servicio__info-estado">Habilitado</strong> y estará disponible
        inmediatamente.
      </p>
      <app-button label="Cancelar" intent="secondary" icon="pi-times" (clicked)="onCancelar()" />
      <app-button
        label="Confirmar"
        intent="primary"
        icon="pi-save"
        [disabled]="confirmDisabled()"
        tooltip="Complete con valores válidos el formulario para continuar"
        (clicked)="onConfirmar()"
      />
    </app-form-actions>
  </app-form-layout>
</app-page-layout>
