<app-page-layout
  pageTitle="Nuevo Servicio"
  pageDescription="Complete los datos para crear un nuevo servicio"
  [showBackButton]="true"
  backButtonLink="/servicios"
>
  <app-form-layout>
    <app-form-section
      title="Información General"
      [fields]="infoFields()"
      [errors]="infoErrors()"
      (valuesChange)="onInfoChange($event)"
      (fieldBlur)="onFieldBlur($event)"
    />

    <app-tarifas-form
      [tarifas]="tarifas"
      [tiposCliente]="tiposClienteTarifa"
      [modalidades]="modalidades()"
      [submitted]="submitted()"
      (agregar)="agregarTarifa()"
      (eliminar)="quitarTarifa($event)"
    />

    <app-form-actions actions>
      <p class="nuevo-servicio__info">
        El servicio se creará en estado
        <strong class="nuevo-servicio__info-estado">Habilitado</strong>
        y estará disponible inmediatamente.
      </p>

      <app-button label="Cancelar" intent="secondary" icon="pi-times" (clicked)="onCancelar()" />

      <app-button
        label="Confirmar"
        intent="primary"
        icon="pi-save"
        [disabled]="confirmDisabled()"
        tooltip="Complete con valores válidos el formulario para continuar"
        (clicked)="onConfirmar()"
      />
    </app-form-actions>
  </app-form-layout>
</app-page-layout>
