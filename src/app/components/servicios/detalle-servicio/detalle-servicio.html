<app-page-layout
  pageTitle="Detalle de Servicio"
  pageDescription="Información completa del servicio"
  [showBackButton]="true"
  backButtonLink="/servicios"
>
  <app-form-layout>
    <app-detail-section title="Información del Servicio" [fields]="infoFields()" />

    @if (preciosFields().length) {
      <app-detail-section title="Costo por Persona Extra" [fields]="preciosFields()" />
    }

    @if (servicio()) {
      <section class="tarifas-detalle">
        <div class="tarifas-detalle__header">
          <h3 class="tarifas-detalle__title">Tarifas</h3>
          <div class="tarifas-detalle__separator" aria-hidden="true"></div>
        </div>

        <table class="tarifas-detalle__table">
          <thead>
            <tr>
              <th>Tipo de Cliente</th>
              <th>Modalidad de Cobro</th>
              <th>Precio</th>
              <th>Antigüedad</th>
            </tr>
          </thead>
          <tbody>
            @for (fila of tarifasRows(); track fila.id) {
              <tr>
                <td>{{ fila.tipoCliente }}</td>
                <td>{{ fila.modalidad }}</td>
                <td>$ {{ fila.precio }}</td>
                <td>{{ fila.antiguedad }}</td>
              </tr>
            }
          </tbody>
        </table>
      </section>
    }

    @if (registroData()) {
      <app-detail-registro-section [data]="registroData()!" />
    }

    <app-form-actions actions>
      <app-button label="Editar" icon="pi-pencil" (clicked)="onEditar()" />
    </app-form-actions>
  </app-form-layout>
</app-page-layout>
