<app-page-layout pageTitle="Servicios" pageDescription="Gestiona los servicios disponibles">
  <app-button
    actions
    label="Nuevo Servicio"
    intent="primary"
    icon="pi-plus"
    (clicked)="onNuevoServicio()"
  />

  <app-filter-panel (filterChange)="onFilterChange($event)" />

  <app-table [columns]="columns" [loadDataFn]="loadDataFn" [getRowActions]="rowActions" />
</app-page-layout>

<app-verificando-reservas-dialog
  [visible]="verificandoVisible()"
  [nombreServicio]="servicioSeleccionado()?.nombre ?? ''"
/>

<app-reservas-activas-dialog
  [visible]="reservasActivasVisible()"
  [nombreServicio]="servicioSeleccionado()?.nombre ?? ''"
  [reservas]="reservasProximas()"
  (cancelar)="onCancelarDialog()"
  (deshabilitarSinCancelar)="onDeshabilitarSinCancelar()"
  (deshabilitarYCancelar)="onDeshabilitarYCancelar($event)"
/>
