@if (breakpoint.isMobile()) {
  <app-mob-list-layout>
    <app-mob-page-header header title="Servicios" (menuToggled)="sidebar.open()" />

    <app-mob-filter-panel
      filters
      (filtersApply)="onFilterChange($event)"
      (filtersClear)="onFilterChange({})"
    />

    @for (servicio of mobileList.rows(); track servicio.id) {
      <app-mob-servicio-card [servicio]="servicio" [actions]="mobileRowActions(servicio)" />
    } @empty {
      <div class="servicios-mobile__empty">No se encontraron servicios.</div>
    }

    @if (mobileList.hasMore()) {
      <div appMobInfiniteScroll (scrolled)="mobileList.loadMore()" aria-hidden="true"></div>
    }
  </app-mob-list-layout>
  <app-mob-fab (clicked)="onNuevoServicio()" />
} @else {
  <app-page-layout pageTitle="Servicios" pageDescription="Gestiona los servicios disponibles">
    <app-button
      actions
      label="Nuevo Servicio"
      intent="primary"
      icon="pi-plus"
      (clicked)="onNuevoServicio()"
    />

    <app-filter-panel (filterChange)="onFilterChange($event)" />

    <app-table [columns]="columns" [loadDataFn]="loadDataFn" [getRowActions]="rowActions" />
  </app-page-layout>
}

<app-verification-dialog
  [visible]="verificandoVisible()"
  title="Verificando Reservas"
  [message]="
    'Revisando si el servicio ' +
    (servicioSeleccionado()?.nombre ?? '') +
    ' tiene reservas activas en los próximos 2 meses...'
  "
/>

<app-reservas-activas-dialog
  [visible]="reservasActivasVisible()"
  [nombreServicio]="servicioSeleccionado()?.nombre ?? ''"
  [reservas]="reservasProximas()"
  (cancelar)="onCancelarDialog()"
  (deshabilitarSinCancelar)="onDeshabilitarSinCancelar()"
  (deshabilitarYCancelar)="onDeshabilitarYCancelar($event)"
/>
