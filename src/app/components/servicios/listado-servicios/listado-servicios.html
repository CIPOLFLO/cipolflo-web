<app-page-layout pageTitle="Servicios" pageDescription="Gestiona los servicios disponibles">

    actions
    label="Nuevo Servicio"
    intent="primary"
    icon="pi-plus"
    (clicked)="onNuevoServicio()"
  />

  <app-filter-panel (filterChange)="onFilterChange($event)" />

  <app-table [columns]="columns" [loadDataFn]="loadDataFn" [getRowActions]="rowActions" />
</app-page-layout>
