<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [resizable]="false"
  [draggable]="false"
  header="Verificando Reservas"
  [style]="{ width: '420px' }"
>
  <div class="verificando__content">
    <p-progress-spinner strokeWidth="4" />
    <p class="verificando__text">
      Revisando si el servicio <strong>{{ nombreServicio() }}</strong> tiene reservas activas en los
      próximos 2 meses...
    </p>
  </div>
</p-dialog>
