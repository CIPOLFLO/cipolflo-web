<app-page-layout
  pageTitle="Listado de Clientes"
  pageDescription="Gestiona y consulta información de todos los clientes del sistema"
>
  <app-button actions label="Exportar" intent="secondary" icon="pi-download" />
  <app-button
    actions
    label="Nuevo Socio"
    intent="primary"
    icon="pi-plus"
    (clicked)="onNuevoCliente()"
  />
  <app-filter-panel (filterChange)="onFilterChange($event)" />

  <app-table [columns]="columns" [loadDataFn]="loadDataFn" [getRowActions]="rowActions" />

  <p-dialog
    [visible]="clientePagoSeleccionado() !== null"
    [modal]="true"
    [closable]="false"
    [resizable]="false"
    [draggable]="false"
    [style]="{ width: '520px' }"
  >
    @if (clientePagoSeleccionado(); as clientePago) {
      <app-pago-cuota
        [cliente]="clientePago"
        (cancelado)="onCancelarPagoCuota()"
        (confirmado)="onConfirmarPagoCuota($event)"
      />
    }
  </p-dialog>

  <p-dialog
    [visible]="pagoConfirmado() !== null"
    [modal]="true"
    [closable]="false"
    [resizable]="false"
    [draggable]="false"
    [style]="{ width: '360px' }"
  >
    @if (pagoConfirmado(); as pago) {
      <div class="pago-confirmado">
        <h3>Pago registrado</h3>
        <p>El pago de cuota fue registrado correctamente.</p>
        <p><strong>Total:</strong> $ {{ pago.total }}</p>

        <app-button label="Aceptar" intent="primary" (clicked)="cerrarPagoConfirmado()" />
      </div>
    }
  </p-dialog>
</app-page-layout>
