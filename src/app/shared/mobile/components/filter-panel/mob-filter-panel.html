<div class="mob-filter-panel">
  <app-button
    class="mob-filter-panel__toggle"
    [label]="isExpanded() ? 'Ocultar Filtros' : 'Mostrar Filtros'"
    [icon]="isExpanded() ? '' : 'pi pi-filter'"
    intent="secondary"
    (clicked)="toggle()"
  />

  <div class="mob-filter-panel__body" [class.mob-filter-panel__body--hidden]="!isExpanded()">
    <div class="mob-filter-panel__search">
      <i class="pi pi-search mob-filter-panel__search-icon" aria-hidden="true"></i>
      <app-form-field
        [config]="{
          key: '__search__',
          label: '',
          type: 'text',
          placeholder: searchPlaceholder(),
        }"
        [value]="searchValue()"
        (valueChange)="updateSearch($event)"
      />
    </div>

    <div class="mob-filter-panel__filter-header">
      <span class="mob-filter-panel__filter-title">Filtros</span>
      <button type="button" class="mob-filter-panel__clear-link" (click)="onClear()">
        Limpiar
      </button>
    </div>

    <div class="mob-filter-panel__fields">
      @for (field of filterFields(); track field.key) {
        <app-form-field
          [config]="field"
          [value]="filterValues()[field.key] ?? null"
          (valueChange)="updateFilterValue(field.key, $event)"
        />
      }
    </div>

    <app-button
      class="mob-filter-panel__apply"
      label="Aplicar Filtros"
      intent="primary"
      (clicked)="onApply()"
    />
  </div>
</div>
