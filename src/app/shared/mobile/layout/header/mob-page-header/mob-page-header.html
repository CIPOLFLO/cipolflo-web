<header class="mob-header">
  <div class="mob-header__bar">
    <button class="mob-header__menu-btn" (click)="onMenuClick()">
      <i class="pi pi-bars"></i>
    </button>
    <div class="mob-header__title-block">
      <span class="mob-header__title">{{ title() }}</span>
      @if (subtitle()) {
        <span class="mob-header__subtitle">{{ subtitle() }}</span>
      }
    </div>

    <div class="mob-header__avatar">
      <span>{{ userService.userInitials() }}</span>
    </div>
  </div>

  <!-- Contenido opcional dentro del header azul (ej. el stepper del wizard mobile).
       Si no se proyecta nada, el header se ve igual que siempre. -->
  <ng-content />
</header>
