<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [resizable]="false"
  [draggable]="false"
  [header]="config.title"
  [style]="{ width: config.width ?? '420px' }"
>
  <ng-template #header>
    <span class="confirm-dialog__title">{{ config.title }}</span>
  </ng-template>

  <ng-template #content>
    <p class="confirm-dialog__message">{{ config.message }}</p>
  </ng-template>

  <ng-template #footer>
    <div class="confirm-dialog__actions">
      <app-button
        *If="config.showCancelButton !== false"
        intent="secondary"
        [label]="config.cancelButtonLabel ?? 'Cancelar'"
        (clicked)="onCancel()"
      />

    <app-button
  [intent]="config.variant ?? 'primary'"
  [label]="config.confirmButtonLabel ?? 'Confirmar'"
  (clicked)="onConfirm()"
/>
      />
    </div>
  </ng-template>
</p-dialog>
