<button
  class="button"
  [type]="type()"
  [disabled]="disabled()"
  [class.button--primary]="intent() === 'primary'"
  [class.button--secondary]="intent() === 'secondary'"
  [class.button--success]="intent() === 'success'"
  [class.button--danger]="intent() === 'danger'"
  [class.button--warning]="intent() === 'warning'"
  (click)="handleClick($event)"
>
  @if (icon()) {
    <i [class]="'button__icon pi ' + icon()" aria-hidden="true"></i>
  }
  {{ label() }}
</button>
