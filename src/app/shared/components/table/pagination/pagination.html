<div class="pagination">
  <div class="pagination__left">
    <span class="pagination__info">
      Mostrando {{ firstItem() }} a {{ lastItem() }} de {{ totalElements() }} resultados
    </span>
    <label class="pagination__size-label">
      Filas por página:
      <select
        class="pagination__size-select"
        [value]="pageSize()"
        (change)="onPageSizeChange($event)"
      >
        @for (opt of pageSizeOptions(); track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
    </label>
  </div>

  <div class="pagination__controls">
    <app-button
      label="Anterior"
      intent="secondary"
      [disabled]="page() === 0"
      (clicked)="goTo(page() - 1)"
    />

    @for (p of visiblePages(); track $index) {
      @if (isEllipsis(p)) {
        <span class="pagination__ellipsis">...</span>
      } @else {
        <button
          class="pagination__btn pagination__btn--page"
          [class.pagination__btn--active]="p === page() + 1"
          (click)="goTo(+p - 1)"
        >
          {{ p }}
        </button>
      }
    }

    <app-button
      label="Siguiente"
      intent="secondary"
      [disabled]="page() === totalPages() - 1"
      (clicked)="goTo(page() + 1)"
    />
  </div>
</div>
