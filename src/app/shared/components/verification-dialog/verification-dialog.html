<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [resizable]="false"
  [draggable]="false"
  [header]="title()"
  [style]="{ width: '420px' }"
>
  <div class="verification-dialog__content">
    <p-progress-spinner strokeWidth="4" />

    <p class="verification-dialog__text">
      {{ message() }}
    </p>
  </div>
</p-dialog>
