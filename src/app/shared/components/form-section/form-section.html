<section class="form-section">
  <div class="form-section__header">
    <h3 class="form-section__title">{{ title() }}</h3>
    <div class="form-section__separator" aria-hidden="true"></div>
  </div>
  @if (note()) {
    <p class="form-section__note">{{ note() }}</p>
  }
  <div class="form-section__fields">
    @for (field of fields(); track field.key) {
      <app-form-field
        [config]="field"
        [error]="errors()[field.key] ?? null"
        (valueChange)="onFieldValueChange(field.key, $event)"
        (blurred)="onFieldBlur(field.key)"
      />
    }
    <ng-content />
  </div>
</section>
