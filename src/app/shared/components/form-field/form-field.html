<label class="form-field__label" [attr.for]="displayOnly() ? null : config().key">
  {{ config().label }}
  @if (config().required) {
    <span class="form-field__required" aria-hidden="true">*</span>
  }
  @if (config().locked) {
    <i class="pi pi-lock form-field__lock-icon" aria-hidden="true"></i>
  }
</label>

@if (displayOnly()) {
  <span
    class="form-field__value"
    [class.form-field__value--multiline]="config().type === 'textarea'"
  >
    {{ value() ?? config().defaultValue ?? '-' }}
  </span>
} @else {
  @switch (config().type) {
    @case ('select') {
      <p-select
        [inputId]="config().key"
        [options]="config().options ?? []"
        optionLabel="label"
        optionValue="value"
        [placeholder]="config().placeholder ?? ''"
        [ngModel]="value() ?? config().defaultValue ?? null"
        (ngModelChange)="value.set($event)"
        (onBlur)="blurred.emit()"
        [disabled]="config().disabled || (config().locked ?? false)"
        [required]="config().required ?? false"
        [invalid]="!!error()"
        [fluid]="true"
      />
    }
    @case ('textarea') {
      <textarea
        pTextarea
        [id]="config().key"
        [placeholder]="config().placeholder ?? ''"
        [disabled]="config().disabled || (config().locked ?? false)"
        [value]="value() ?? config().defaultValue ?? ''"
        (input)="captureInput($event)"
        (blur)="blurred.emit()"
        [required]="config().required ?? false"
        [invalid]="!!error()"
        rows="3"
        [fluid]="true"
      ></textarea>
    }
    @case ('currency') {
      <div class="form-field__currency-row">
        <span class="form-field__currency-prefix">$</span>
        <p-inputNumber
          [inputId]="config().key"
          [placeholder]="config().placeholder ?? '0.00'"
          [disabled]="config().disabled || (config().locked ?? false)"
          [required]="config().required ?? false"
          [invalid]="!!error()"
          [ngModel]="numericValue"
          (ngModelChange)="captureNumericInput($event)"
          (onBlur)="blurred.emit()"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [min]="0"
          [fluid]="true"
        />
      </div>
    }
    @default {
      <input
        pInputText
        [id]="config().key"
        [type]="config().type"
        [placeholder]="config().placeholder ?? ''"
        [disabled]="config().disabled || (config().locked ?? false)"
        [value]="value() ?? config().defaultValue ?? ''"
        (input)="captureInput($event)"
        (blur)="blurred.emit()"
        [required]="config().required ?? false"
        [invalid]="!!error()"
        [fluid]="true"
      />
    }
  }
}

@if (!displayOnly() && error()) {
  <span class="form-field__error">{{ error() }}</span>
}
