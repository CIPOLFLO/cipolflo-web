<header class="header">
  <div class="header__brand">
    <span class="header__title">Asociación Civil Círculo Policial de Flores</span>
  </div>

  <nav class="header__nav">
    <a routerLink="/reservas" routerLinkActive="active" class="header__nav-item">
      <i class="pi pi-calendar"></i> Reservas
    </a>
    <a routerLink="/clientes" routerLinkActive="active" class="header__nav-item">
      <i class="pi pi-users"></i> Clientes
    </a>
    <a routerLink="/finanzas" routerLinkActive="active" class="header__nav-item">
      <i class="pi pi-wallet"></i> Finanzas
    </a>
    <a routerLink="/servicios" routerLinkActive="active" class="header__nav-item">
      <i class="pi pi-building"></i> Servicios
    </a>
    <a routerLink="/ajustes" routerLinkActive="active" class="header__nav-item">
      <i class="pi pi-cog"></i> Ajustes
    </a>
  </nav>
  @if (auth.user$ | async; as user) {
    <div class="header__user">
      <div class="header__avatar">{{ userService.userInitials() }}</div>
      <span class="header__username">{{ user.name ?? user.email }}</span>
      <button class="header__logout" (click)="logout()">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  }
</header>
